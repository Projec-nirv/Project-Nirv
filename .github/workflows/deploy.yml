name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch's name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # Generated dependencies were historically committed because of a
      # malformed .gitignore. Always build from the lockfile instead.
      - name: Remove tracked generated files
        run: rm -rf node_modules .astro dist

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build your site
        run: pnpm run build

      # Astro does not copy dot-directories from public/ into static output.
      - name: Include agent discovery endpoints
        run: |
          mkdir -p dist/.well-known
          cp -R public/.well-known/. dist/.well-known/
          test -f dist/.well-known/api-catalog

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
